[workspace]
resolver = "3"
members = ["crates/*", "spikes/*"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MIT"
rust-version = "1.94"
repository = "https://github.com/samanvayms/pageindex-rust"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
indexmap = { version = "2", features = ["serde"] }
anyhow = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
pi-core = { path = "crates/pi-core" }
pi-pycompat = { path = "crates/pi-pycompat" }
pi-data = { path = "crates/pi-data" }
regex = "1"
unicode-normalization = "0.1"
pi-llm = { path = "crates/pi-llm" }
pi-optimize = { path = "crates/pi-optimize" }
async-trait = "0.1"
futures = "0.3"
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
sha2 = "0.10"
tiktoken-rs = "0.7"
unicode-general-category = "1"
proptest = "1"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
