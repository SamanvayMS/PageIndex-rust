[workspace]
resolver = "3"
members = ["crates/*", "spikes/*"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MIT"
rust-version = "1.94"
repository = "https://github.com/samanvayms/pageindex-rust"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
indexmap = { version = "2", features = ["serde"] }
anyhow = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
pi-core = { path = "crates/pi-core" }
pi-pycompat = { path = "crates/pi-pycompat" }
pi-data = { path = "crates/pi-data" }
pi-extract = { path = "crates/pi-extract" }
regex = "1"
unicode-normalization = "0.1"
pi-llm = { path = "crates/pi-llm" }
pi-optimize = { path = "crates/pi-optimize" }
async-trait = "0.1"
futures = "0.3"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "io-std", "fs", "sync", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
sha2 = "0.10"
tiktoken-rs = "0.7"
unicode-general-category = "1"
proptest = "1"
pi-store = { path = "crates/pi-store" }
pi-config = { path = "crates/pi-config" }
pi-storage = { path = "crates/pi-storage" }
pi-mcp = { path = "crates/pi-mcp" }
uuid = { version = "1", features = ["v4"] }
md-5 = "0.11"
toml = "1"
tempfile = "3"
object_store = { version = "0.14", default-features = false }
rmcp = { version = "3.5", default-features = false }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
