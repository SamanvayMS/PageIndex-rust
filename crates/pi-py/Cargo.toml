[package]
name = "pi-py"
description = "Python bindings (pageindex_rs): index, extract, triage, MCP tools"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[lib]
name = "pageindex_rs"
crate-type = ["cdylib", "rlib"]

[features]
default = []
# Set by maturin (pyproject.toml); plain `cargo build` links libpython instead.
extension-module = ["pyo3/extension-module"]

[dependencies]
pyo3 = { version = "0.29", features = ["abi3-py310"] }
anyhow.workspace = true
serde_json.workspace = true
tokio.workspace = true
pi-config.workspace = true
pi-extract.workspace = true
pi-index.workspace = true
pi-mcp.workspace = true
pi-store.workspace = true
pi-triage.workspace = true
